<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/mudarTema.css">
    <link rel="stylesheet" href="../css/acessibilidade.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="../js/mudarTema.js" defer></script>
    <script src="../js/acessibilidade.js" defer></script>
    <script src="../../controller_view/login.js" defer></script>

</head>

<body>

    <section class="mudarTema">

        <button type="button" id="btnConfig">

            <i class="fa-solid fa-gear"></i>

        </button>

        <div id="menuTema">

            <a href="../html/cadastroClaro.html">

                <i class="fa-solid fa-sun"></i>

                Tema Claro

            </a>

            <a href="../html/indexEscuro.html">

                <i class="fa-solid fa-moon"></i>

                Tema Escuro

            </a>

        </div>

    </section>


    <section class="acessibilidade">

        <button type="button" id="btnAcessibilidade">

            <i id="iconeAcess"
                class="fa-solid fa-universal-access"></i>

        </button>

        <div id="menuAcessibilidade">

            <h3>Acessibilidade</h3>

            <button type="button" id="btnLeitura">

                <i class="fa-solid fa-volume-high"></i>

                Leitura por voz

            </button>

            <button type="button" id="btnAumentar">

                <i class="fa-solid fa-plus"></i>

                Aumentar elementos

            </button>

            <button type="button" id="btnDiminuir">

                <i class="fa-solid fa-minus"></i>

                Diminuir elementos

            </button>

            <button type="button" id="btnSaturacao">

                <i class="fa-solid fa-circle-half-stroke"></i>

                Saturação

            </button>

        </div>

    </section>


    <main class="container">

        <section class="logo">

            <img src="../imagens/logo.png"
                alt="Logo da gvendix">

        </section>


        <section id="formulario">

            <div class="botoes">

                <a href="../html/loginEscuro.html"
                    class="btn entrar ativo">

                    Entrar

                </a>

                <a href="../html/indexEscuro.html"
                    class="btn criarConta"
                    style="color: #9C9C9C">

                    Criar conta

                </a>

            </div>


            <form id="formLogin">

                <div class="input-box">

                    <i class="fa-regular fa-envelope"></i>

                    <input type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com">

                </div>


                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha">

                </div>


                <div class="opcoesLogin">

                    <label class="lembrarSenha">

                        <input type="checkbox"
                            id="lembrarSenha">

                        <span class="checkmark"></span>

                        Lembrar senha

                    </label>


                    <button type="button"
                        id="btnEsquecerSenha">

                        Esquecer senha?

                    </button>

                </div>


                <button type="submit"
                    id="btnLogar">

                    Logar

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>


            <section id="recuperarSenha">

                <div class="headerRecuperarSenha">

                    <h2>Alterar senha</h2>

                    <button type="button"
                        id="fecharRecuperarSenha">

                        <i class="fa-solid fa-xmark"></i>

                    </button>

                </div>


                <p>
                    Informe seu e-mail e defina uma nova senha.
                </p>


                <div class="input-box">

                    <i class="fa-regular fa-envelope"></i>

                    <input type="email"
                        id="emailRecuperacao"
                        placeholder="seu@email.com">

                </div>


                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                        id="novaSenha"
                        placeholder="Nova senha">

                </div>


                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                        id="confirmarNovaSenha"
                        placeholder="Confirmar nova senha">

                </div>


                <div class="botoesRecuperarSenha">

                    <button type="button"
                        id="btnCancelarRecuperacao">

                        Cancelar

                    </button>


                    <button type="button"
                        id="btnSalvarNovaSenha">

                        Salvar senha

                    </button>

                </div>

            </section>

        </section>

    </main>

</body>

</html>
